[project]
name = "aerocool-ai"
version = "0.1.0"
description = "Physics-Informed Neural Network (PINN) & geospatial analytics platform to detect Urban Heat Island hotspots and optimize spatial cooling interventions."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Gesicht436", email = "186572303+Gesicht436@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "affine>=3.0.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "earthengine-api>=1.7.40",
    "fastapi>=0.141.1",
    "geoalchemy2>=0.20.0",
    "geopandas>=1.1.4",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.5.2",
    "oauth2>=1.9.0.post1",
    "optuna>=4.9.0",
    "osmnx>=2.1.1",
    "pandas>=3.0.5",
    "playwright>=1.62.0",
    "pydantic-settings>=2.15.0",
    "pyowm>=3.5.0",
    "pystac-client>=0.9.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "rasterstats>=0.21.0",
    "redis>=8.1.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "scrapy>=2.18.0",
    "selenium>=4.47.0",
    "sentinelsat>=1.2.1",
    "shapely>=2.1.2",
    "torch",
    "uvicorn>=0.52.4",
    "xgboost>=3.4.1",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[project.scripts]
aerocool-ai = "aerocool_ai:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
